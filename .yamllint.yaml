# yamllint Configuration

extends: default

rules:
  line-length:
    max: 120
    level: warning
  trailing-spaces: enable
  empty-lines:
    max: 2
    max-start: 1
    max-end: 1
  document-start: disable
  document-end: disable
  indentation:
    spaces: 2
    indent-sequences: consistent
  braces:
    min-spaces-inside: 1
    max-spaces-inside: 1
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 0
  colons:
    max-spaces-before: 0
    max-spaces-after: 1
  commas:
    max-spaces-before: 0
    min-spaces-after: 1
  hyphens:
    max-spaces-after: 1
  key-duplicates: enable
  key-ordering: disable